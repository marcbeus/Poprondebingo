<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F1F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Popronde Bingo 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F1F1;
    --fg:#000;
    --dim:#6B6B6B;
    --green:#12A54B;
    --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--bg);color:var(--fg)}

  /* Popronde's eigen kopfont, alleen als het toevallig op het toestel staat.
     Wordt niet gedownload, dus nooit blokkerend. Anders valt hij terug op Archivo. */
  @font-face{
    font-family:'Popronde';
    src:local('popronderegular'), local('Popronde Regular'), local('Popronde');
    font-display:swap;
  }
  body{
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  }
  button,input{font:inherit;color:inherit;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--green);outline-offset:3px}

  .display,.yr{font-family:'Popronde',Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .display{font-weight:800;letter-spacing:-.045em;line-height:.86;margin:0;
    text-transform:uppercase}
  .pill{background:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;
    font-size:15px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .pill:active{background:#e7e7e7}

  /* ---------------- inloggen ---------------- */
  #login{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 40px) var(--pad) 40px;max-width:1100px;margin:0 auto}
  #login .display{font-size:clamp(46px,13.5vw,132px)}
  #login .yr{font-size:clamp(46px,13.5vw,132px);font-weight:800;letter-spacing:-.045em;
    line-height:.86;margin:0 0 34px}
  #login p{color:var(--dim);max-width:34ch;margin:0 0 22px;font-size:16px}
  .field{display:flex;gap:10px;flex-wrap:wrap;max-width:460px}
  .field input{flex:1;min-width:190px;background:#fff;border:0;border-radius:999px;
    padding:14px 22px;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .field input::placeholder{color:#9A9A9A}
  .field .pill{background:var(--fg);color:#fff;font-weight:700}
  .field .pill:disabled{opacity:.3}
  #login small{display:block;color:var(--dim);font-size:13px;margin-top:20px}

  /* ---------------- kop ---------------- */
  header{max-width:1600px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 26px) var(--pad) 6px}
  header .display{font-size:clamp(34px,8.5vw,86px)}
  header .yr{font-size:clamp(34px,8.5vw,86px);font-weight:800;letter-spacing:-.045em;
    line-height:.86;margin:0}
  .toolbar{position:sticky;top:0;z-index:9;background:var(--bg);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px var(--pad);max-width:1600px;margin:0 auto}
  .toolbar .score{background:var(--fg);color:#fff;border-radius:999px;padding:12px 22px;
    font-weight:700;font-size:15px;white-space:nowrap}
  .toolbar .score b{font-size:19px}
  .toolbar .who{margin-left:auto;color:var(--dim);font-size:14px;display:flex;
    align-items:center;gap:12px}
  .toolbar .who button{background:none;border:0;color:var(--dim);text-decoration:underline;
    cursor:pointer;font-size:14px;padding:8px 0;min-height:36px}

  /* ---------------- raster ---------------- */
  main{max-width:1600px;margin:0 auto;padding:12px var(--pad) 48px;
    columns:2;column-gap:14px}
  @media(min-width:700px){main{columns:3;column-gap:20px}:root{--pad:28px}}
  @media(min-width:1080px){main{columns:4;column-gap:24px}}
  .act{display:block;width:100%;break-inside:avoid;margin:0 0 24px;padding:0;
    background:none;border:0;text-align:left;cursor:pointer;position:relative}
  .shot{position:relative;border-radius:8px;overflow:hidden;background:#DCDCDC;
    line-height:0;border:4px solid transparent;transition:border-color .12s}
  .shot img{width:100%;height:auto;display:block}
  .shot .noimg{display:flex;align-items:center;justify-content:center;
    aspect-ratio:4/5;padding:14px;font-weight:700;font-size:15px;line-height:1.2;
    color:#8A8A8A;text-align:center}
  .act .nm{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;
    padding:9px 2px 0;word-break:break-word}
  .act .mensen{display:block;font-size:13px;color:var(--dim);padding:2px 2px 0}
  .act.on .shot{border-color:var(--green)}
  .act.on .nm{color:var(--green)}
  .act.on .shot::after{content:"\2713";position:absolute;right:8px;top:8px;
    width:30px;height:30px;border-radius:999px;background:var(--green);color:#fff;
    font-size:17px;font-weight:700;line-height:30px;text-align:center;z-index:2}
  .act:active .shot{opacity:.75}

  /* ---------------- ranglijst ---------------- */
  #rang{max-width:760px;margin:0 auto;padding:12px var(--pad) 48px}
  #rang ol{list-style:none;margin:0;padding:0}
  #rang li{display:flex;align-items:center;gap:14px;padding:14px 0;
    border-bottom:1px solid #DEDEDE}
  #rang .plek{font-weight:800;font-size:18px;width:2.2ch;color:var(--dim);flex-shrink:0}
  #rang .persoon{flex:1;min-width:0}
  #rang .persoon .naam{font-weight:700;font-size:17px;word-break:break-word}
  #rang .balk{height:6px;border-radius:999px;background:#D8D8D8;margin-top:8px;overflow:hidden}
  #rang .balk i{display:block;height:100%;background:var(--fg);border-radius:999px}
  #rang .aantal{font-weight:800;font-size:19px;white-space:nowrap;flex-shrink:0}
  #rang .aantal span{font-weight:600;font-size:13px;color:var(--dim)}
  #rang li.ik .naam{color:var(--green)}
  #rang li.ik .balk i{background:var(--green)}
  #rang .leeg{color:var(--dim);padding:24px 0}

  footer{max-width:1600px;margin:0 auto;color:var(--dim);font-size:13px;
    padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 40px)}
  footer a{color:var(--dim)}
  footer button{background:none;border:0;color:var(--dim);text-decoration:underline;
    cursor:pointer;font-size:13px;padding:10px 0;display:block}
  #status{font-size:13px;color:var(--dim);padding:0 0 6px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="login" hidden>
  <h1 class="display">Popronde<br>Bingo</h1>
  <p class="yr">2026</p>
  <p>Vink af welke acts je live hebt gezien. Gebruik steeds dezelfde voornaam, die is je sleutel.</p>
  <div class="field">
    <input type="text" id="naam" placeholder="Je voornaam" autocomplete="given-name"
           autocapitalize="words" enterkeyhint="go">
    <button class="pill" id="start" disabled>Start</button>
  </div>
  <small id="intro"></small>
</section>

<div id="app" hidden>
  <header>
    <h1 class="display">Popronde<br>Bingo</h1>
    <p class="yr">2026</p>
  </header>
  <div class="toolbar">
    <div class="score"><b id="n">0</b><span id="tot"></span> gezien</div>
    <button class="pill" id="wissel">Ranglijst</button>
    <div class="who"><span id="hi"></span><button id="switch">andere naam</button></div>
  </div>

  <main id="grid"></main>

  <section id="rang" hidden>
    <ol id="ranglijst"></ol>
    <p class="leeg" id="rangleeg" hidden>Nog niemand heeft iets afgevinkt.</p>
  </section>

  <footer>
    <p id="status"></p>
    <p>Line-up, speeldata en foto's: <a href="https://popronde.nl/artiesten" target="_blank" rel="noopener">popronde.nl/artiesten</a>. Foto's blijven eigendom van Popronde en de artiesten.</p>
    <button id="reset">Mijn vinkjes weer op nul</button>
  </footer>
</div>

<script src="fotos.js"></script>
<script>
/* ------------------------------------------------------------------
   Plak hier de URL van je Apps Script web-app (eindigt op /exec).
   Laat leeg om de pagina zonder Google Sheet te gebruiken.
------------------------------------------------------------------ */
var API = 'https://docs.google.com/spreadsheets/d/1VJFydaGwFSy_5N_n5Ajzqie6n7kjSh9MnefbPA_uyXw/edit?gid=1890876848#gid=189087';

// Selectie 2026 zoals die op popronde.nl/artiesten staat. [naam, popronde profiel-id]
var ACTS = [
["AMANI",36408],["Amazone",37654],["Amelie Spinks",36902],["Angelo Benson",37368],
["Anna Joan",36943],["aquelarre*",36714],["ARA",37534],["BARBEE",37053],
["BigBobbyBitch",37634],["Brian Murphy",36376],["CAH",37257],["Calis Nyarko",36247],
["Cedric Vermue",36778],["Coalmine Canary",36952],["Competition",37104],["crashing",36259],
["Day Mosh",37678],["DE FORMULE",36989],["De Plaag",37395],["De Zweefclub",36723],
["Doris Vosters",37168],["Dracula's Beach Party",37585],["Duygu Alkan",36263],["Elaine",37404],
["Else Lena",36835],["Eyesores",36557],["F.I.X.",36410],["Fabienne Julie",37371],
["faradays",37311],["Favour",36527],["FEMI",37107],["Gabbi Lieve",36993],
["GIB",36844],["Gilly",37536],["girlhead",37651],["Grandad",37025],
["Gus Walker",36915],["Homey Citadel",36251],["HOOFS",37281],["Igor",37280],
["Imme",37060],["In Good Spirit",37407],["INOYSON",36223],["Jada Faith",37028],
["JAH",37010],["Jim Gardner",37774],["JLK & _heART.felt",37748],["Keely Westwood",36913],
["Kidd Nebula & The Voodoo-Funk Conspiracy",36789],["KRAM",36937],["Kruzer",36435],["KUZKO",37518],
["LAHAYE",36797],["Loeck",36906],["Lola Louii",37416],["LÖNA",37151],
["Lucy Fabienne",37244],["Magazines",37530],["MAHA",37653],["Mahala",37042],
["Marieke Schenk",36521],["Marit Nygård en de Medemensen",36626],["Maxime",36817],["MAYTE",36950],
["Mees",37509],["Merle",37682],["Mick Spek",36503],["Misha Wong",36810],
["morèl",36911],["NEBULA",37420],["Nelles",37233],["Nyarko",36695],
["Ontaard",36940],["Pensive Vivifier",37126],["Post Ella",37108],["REZA",37234],
["RubinCarter",36916],["Semuta",36910],["Send Me Flowers",37696],["SLOJAY",36971],
["Sterre Jasmine",37124],["SUUS",36633],["SWANSLAUGHTER",36372],["tays",37037],
["tenderblom",36934],["Tessa June",36907],["The Awkward",37386],["The Hook",37235],
["The Pelumas",37142],["The Robots Are Coming",37017],["theo artz",37402],["Toobss",36727],
["Trackvogels",37255],["Vonder",37425],["WABR",37243],["Weird Youth",36426],
["Wendy Moore",36243],["Wilson A.",37482],["Wolfgang",36860],["xico",36347],
["YRSA",37367],["Zergüzeşt",36586]
];

var FOTOS = window.FOTOS || {};
var TELLING = {};   // artiestId -> aantal mensen
var LIJST = [];     // [ [naam, aantal acts], ... ] hoog naar laag
var knop = {};      // artiestId -> knop in het raster

// localStorage waar het mag, anders alleen deze sessie.
var mem = {};
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};

var naam = store.get('prbingo.naam') || '';
var gezien = {};
function key() { return 'prbingo.' + naam.toLowerCase(); }
function laad() { try { gezien = JSON.parse(store.get(key()) || '{}'); } catch (e) { gezien = {}; } }
function bewaar() { store.set(key(), JSON.stringify(gezien)); }

function $(id) { return document.getElementById(id); }

function mijnAantal() {
  var n = 0, k;
  for (k in gezien) if (gezien[k]) n++;
  return n;
}

/* ---------- praten met de Google Sheet via JSONP ----------
   JSONP omdat een <script>-tag geen CORS kent. Zo hoef je in
   Apps Script niets met preflight of headers te doen.        */
function api(params, klaar) {
  if (!API) { if (klaar) klaar(null); return; }
  var cb = 'prcb' + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var timer = setTimeout(function () { op(null); }, 15000);
  function op(data) {
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
    if (klaar) klaar(data);
  }
  window[cb] = op;
  params.callback = cb;
  params._t = Date.now();
  var q = [];
  for (var k in params) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + q.join('&');
  s.onerror = function () { op(null); };
  document.head.appendChild(s);
}

function melding(t) { $('status').textContent = t; }

function verwerk(data, ookMijn) {
  if (!data || data.fout) {
    melding(data && data.fout
      ? 'De sheet gaf een fout: ' + data.fout
      : 'Geen verbinding met de sheet. Je vinkjes staan wel op dit toestel.');
    return;
  }
  TELLING = data.tel || {};
  LIJST = data.lijst || [];
  if (ookMijn && data.mijn) {
    for (var id in data.mijn) gezien[id] = true;
    bewaar();
    bouw();
  }
  tekenTellingen();
  tekenRang();
  teller();
  melding('Bijgewerkt om ' + new Date().toLocaleTimeString('nl-NL').slice(0, 5) + '.');
}

function synchroniseer(ookMijn) {
  if (!API) { melding('Geen sheet ingesteld, alles blijft op dit toestel.'); return; }
  melding('Bijwerken...');
  api({ naam: naam }, function (d) { verwerk(d, ookMijn); });
}

function zinnetje(n) {
  if (!n) return 'nog niemand gezien';
  if (n === 1) return '1 persoon gezien';
  return n + ' mensen gezien';
}

function tekenTellingen() {
  ACTS.forEach(function (a) {
    var b = knop[a[1]];
    if (!b) return;
    b.querySelector('.mensen').textContent = zinnetje(TELLING[a[1]] || 0);
  });
}

/* Zet mijn eigen aantal in LIJST bij zodat de ranglijst meteen klopt,
   ook voordat de sheet heeft geantwoord. */
function eigenInLijst() {
  if (!naam) return;
  var n = mijnAantal(), gevonden = false;
  for (var i = 0; i < LIJST.length; i++) {
    if (String(LIJST[i][0]).toLowerCase() === naam.toLowerCase()) { LIJST[i][1] = n; gevonden = true; break; }
  }
  if (!gevonden && n > 0) LIJST.push([naam, n]);
  LIJST.sort(function (a, b) {
    if (b[1] !== a[1]) return b[1] - a[1];
    return String(a[0]).toLowerCase() < String(b[0]).toLowerCase() ? -1 : 1;
  });
}

function tekenRang() {
  eigenInLijst();
  var ol = $('ranglijst');
  ol.textContent = '';
  var top = LIJST.length ? LIJST[0][1] : 0;
  $('rangleeg').hidden = LIJST.length > 0;
  LIJST.forEach(function (r, i) {
    var li = document.createElement('li');
    if (String(r[0]).toLowerCase() === naam.toLowerCase()) li.className = 'ik';

    var plek = document.createElement('div');
    plek.className = 'plek';
    plek.textContent = (i + 1) + '.';

    var p = document.createElement('div');
    p.className = 'persoon';
    var nm = document.createElement('div');
    nm.className = 'naam';
    nm.textContent = r[0];
    var balk = document.createElement('div');
    balk.className = 'balk';
    var vul = document.createElement('i');
    vul.style.width = (top ? Math.round(r[1] / top * 100) : 0) + '%';
    balk.appendChild(vul);
    p.appendChild(nm);
    p.appendChild(balk);

    var a = document.createElement('div');
    a.className = 'aantal';
    a.textContent = r[1];
    var s = document.createElement('span');
    s.textContent = r[1] === 1 ? ' act' : ' acts';
    a.appendChild(s);

    li.appendChild(plek);
    li.appendChild(p);
    li.appendChild(a);
    ol.appendChild(li);
  });
}

function teller() {
  $('n').textContent = mijnAantal();
  document.title = mijnAantal() + '/' + ACTS.length + ' - Popronde Bingo 2026';
}

function geenFoto(nm) {
  var d = document.createElement('div');
  d.className = 'noimg';
  d.textContent = nm;
  return d;
}

function bouw() {
  $('tot').textContent = '/' + ACTS.length;
  $('hi').textContent = naam;
  var g = $('grid');
  g.textContent = '';
  knop = {};
  ACTS.forEach(function (a) {
    var nm = a[0], id = a[1], foto = FOTOS[id];
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'act' + (gezien[id] ? ' on' : '');
    b.setAttribute('aria-pressed', gezien[id] ? 'true' : 'false');

    var shot = document.createElement('div');
    shot.className = 'shot';
    if (foto) {
      var im = document.createElement('img');
      im.src = foto + (foto.indexOf('?') < 0 ? '?width=600' : '');
      im.alt = nm;
      im.loading = 'lazy';
      im.decoding = 'async';
      im.onerror = function () { im.parentNode.replaceChild(geenFoto(nm), im); };
      shot.appendChild(im);
    } else {
      shot.appendChild(geenFoto(nm));
    }

    var lab = document.createElement('span');
    lab.className = 'nm';
    lab.textContent = nm;
    var men = document.createElement('span');
    men.className = 'mensen';

    b.appendChild(shot);
    b.appendChild(lab);
    b.appendChild(men);
    b.onclick = function () {
      var nu = !gezien[id];
      gezien[id] = nu;
      b.classList.toggle('on', nu);
      b.setAttribute('aria-pressed', nu ? 'true' : 'false');
      bewaar();
      teller();
      // meteen bijwerken zodat het direct reageert, de sheet corrigeert zo nodig
      TELLING[id] = Math.max(0, (TELLING[id] || 0) + (nu ? 1 : -1));
      tekenTellingen();
      tekenRang();
      api({ actie: 'zet', naam: naam, id: id, gezien: nu ? 1 : 0 }, function (d) {
        verwerk(d, false);
      });
    };
    knop[id] = b;
    g.appendChild(b);
  });
  tekenTellingen();
  teller();
}

function toon(w) {
  $('login').hidden = w !== 'login';
  $('app').hidden = w !== 'app';
}

function toonRang(aan) {
  $('grid').hidden = aan;
  $('rang').hidden = !aan;
  $('wissel').textContent = aan ? 'Terug naar de acts' : 'Ranglijst';
  window.scrollTo(0, 0);
}

$('intro').textContent = ACTS.length + ' acts, 40 steden, 12 september tot en met 28 november.';
$('naam').oninput = function () { $('start').disabled = !this.value.trim(); };
$('naam').onkeydown = function (e) { if (e.key === 'Enter' && this.value.trim()) $('start').click(); };
$('start').onclick = function () {
  naam = $('naam').value.trim();
  store.set('prbingo.naam', naam);
  laad(); bouw(); tekenRang(); toon('app'); toonRang(false);
  synchroniseer(true);
};
$('switch').onclick = function () {
  $('naam').value = naam; $('start').disabled = false;
  toon('login'); $('naam').focus();
};
$('wissel').onclick = function () { toonRang($('rang').hidden); };
$('reset').onclick = function () {
  if (!confirm('Alle vinkjes van ' + naam + ' wissen?')) return;
  var oud = Object.keys(gezien).filter(function (k) { return gezien[k]; });
  gezien = {}; bewaar(); bouw(); tekenRang();
  oud.forEach(function (id) { api({ actie: 'zet', naam: naam, id: id, gezien: 0 }); });
  setTimeout(function () { synchroniseer(false); }, 1500);
};

window.addEventListener('focus', function () { if (!$('app').hidden) synchroniseer(false); });

if (naam) { laad(); bouw(); tekenRang(); toon('app'); synchroniseer(true); } else { toon('login'); }
</script>
</body>
</html>
